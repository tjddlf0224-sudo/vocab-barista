<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vocab Barista — 탐험</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{ --gold:#ffb300; --brown:#5d4037; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{ font-family:'Jua','Nunito',system-ui,sans-serif; background:#1c2f1e; color:#fff8e1;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #rotator{ position:fixed; top:0; left:0; width:100%; height:100%; }
  #game{ position:fixed; inset:0; }
  #map{ position:absolute; inset:0; width:100%; height:100%; display:block; image-rendering:pixelated; touch-action:none; }

  /* 상단 HUD */
  .topbar{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:8px;
    padding:8px 12px; z-index:5; pointer-events:none; }
  .topbar > *{ pointer-events:auto; }
  .back-btn{ background:linear-gradient(180deg,#8d6e63,#5d4037); color:#fff8e1; border:none;
    border-radius:11px; padding:7px 12px; font-family:inherit; font-size:.9rem; box-shadow:0 3px 0 rgba(0,0,0,.4);
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap; flex:none; }
  .back-btn svg{ width:16px; height:16px; display:block; flex:none; }
  .back-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.4); }
  .hud-stats{ display:flex; gap:6px; margin-left:auto; font-size:.85rem; flex-wrap:wrap; justify-content:flex-end; }
  .hud-stats .chip{ background:rgba(0,0,0,.42); padding:4px 9px; border-radius:20px; white-space:nowrap; }
  .zone-name{ background:rgba(0,0,0,.42); padding:4px 10px; border-radius:20px; font-size:.82rem; color:var(--gold); white-space:nowrap; flex:none; }
  /* ===== 미니맵 ===== */
  #minimap-wrap{ position:absolute; top:54px; right:12px; z-index:4; text-align:center; cursor:pointer; padding:5px; border-radius:14px;
    background:rgba(16,14,22,.38); backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px);
    box-shadow:0 4px 12px rgba(0,0,0,.35), inset 0 0 0 1px rgba(255,255,255,.08); transition:background .2s; }
  #minimap-wrap:active{ background:rgba(16,14,22,.55); }
  #minimap-inner{ position:relative; width:120px; height:85px; border-radius:10px; overflow:hidden;
    box-shadow:0 0 0 2px rgba(20,16,10,.65), 0 0 0 3.5px rgba(255,207,77,.65), 0 3px 10px rgba(0,0,0,.5); }
  #minimap{ width:120px; height:85px; image-rendering:pixelated; image-rendering:crisp-edges; display:block; background:#10121a; opacity:.86; }
  #minimap-inner::after{ content:''; position:absolute; inset:0; pointer-events:none; border-radius:10px;
    background:radial-gradient(ellipse at center, transparent 42%, rgba(6,4,10,.55) 100%); }
  .mm-badge{ margin-top:4px; font-size:.66rem; color:#fff; background:rgba(0,0,0,.55); border-radius:8px; padding:1px 8px; display:inline-block; font-family:'Jua',sans-serif; }
  .mm-badge.done{ background:#e0761f; }
  /* ===== 전체 지도 뷰 ===== */
  .mv-box{ background:linear-gradient(180deg,#fffdf7,#fff2d8); border:3px solid #caa26a; border-radius:20px; padding:16px; text-align:center; font-family:'Jua','Nunito',sans-serif; box-shadow:0 12px 30px rgba(0,0,0,.4); max-width:92vw; }
  .mv-title{ font-size:1.1rem; font-weight:bold; color:#5b3b1a; margin-bottom:10px; }
  .mv-done{ color:#e0761f; }
  .mv-canvas{ image-rendering:pixelated; border:2px solid #8a6a3a; border-radius:8px; background:#10121a; max-width:82vw; height:auto; }
  .mv-legend{ font-size:.72rem; color:#6b5334; margin:10px 0; }

  /* 토스트 */
  #toast{ position:absolute; top:48px; left:50%; transform:translateX(-50%); background:rgba(20,12,10,.92);
    border:2px solid var(--gold); border-radius:14px; padding:10px 16px 10px 20px; font-size:.98rem; z-index:6;
    opacity:0; transition:opacity .25s; pointer-events:none; text-align:left; max-width:80%; }
  #toast.show{ opacity:1; }
  #toast .en{ color:var(--gold); font-weight:bold; } #toast .ko{ color:#cde; opacity:.85; font-size:.85rem; }
  #toast .toast-li{ display:block; padding-left:1.3em; text-indent:-1.3em; margin-top:2px; }
  #toast .toast-sub{ display:block; padding-left:2.2em; text-indent:-1.1em; margin-top:2px; }

  /* 조이스틱 (좌하단) */
  #stick-zone{ position:absolute; left:0; bottom:0; width:46%; height:62%; z-index:4; touch-action:none; }
  #stick-base{ position:absolute; left:28px; bottom:28px; width:118px; height:118px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.16), rgba(255,255,255,.06));
    border:3px solid rgba(255,255,255,.28); }
  #stick-knob{ position:absolute; left:28px; bottom:28px; width:56px; height:56px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(200,200,200,.8));
    box-shadow:0 3px 8px rgba(0,0,0,.4); transform:translate(31px,-31px); pointer-events:none; }

  /* 채집 버튼 (우하단) */
  /* 채집 버튼 — 깔끔한 프로스티드(반투명+블러) + 흰 아이콘 */
  .abtn{ position:absolute; right:26px; bottom:34px; width:82px; height:82px; border-radius:50%;
    border:2px solid rgba(255,255,255,.7); z-index:4; font-family:inherit; font-weight:bold; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    background:rgba(255,255,255,.16); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    box-shadow:0 4px 12px rgba(0,0,0,.28), inset 0 1px 2px rgba(255,255,255,.4);
    transition:transform .1s, background .2s, box-shadow .2s, border-color .2s; }
  .abtn .ab-ico{ display:flex; line-height:0; filter:drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
  .abtn .ab-ico svg{ width:32px; height:32px; display:block; }
  .abtn .ab-tx{ font-size:.8rem; letter-spacing:1px; text-shadow:0 1px 3px rgba(0,0,0,.55); }
  .abtn:active{ transform:scale(.93); background:rgba(255,255,255,.28); }
  /* 채집 가능 범위 안 — 초록빛 링 강조 + 은은한 맥동 */
  .abtn.ready{ border-color:rgba(120,240,150,.95); background:rgba(90,220,130,.26);
    box-shadow:0 0 0 3px rgba(90,220,130,.3), 0 4px 16px rgba(40,180,90,.4), inset 0 1px 2px rgba(255,255,255,.4);
    animation:abReady 1.1s ease-in-out infinite; }
  @keyframes abReady{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.06); } }
  /* 회복 물약 버튼 (채집 버튼 위) */
  /* 회복 물약 버튼 — 채집과 동일한 프로스티드 스타일 */
  .hbtn{ position:absolute; right:37px; bottom:130px; width:58px; height:58px; border-radius:50%;
    border:2px solid rgba(255,255,255,.7); z-index:4; font-family:inherit; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:rgba(255,255,255,.16); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px);
    box-shadow:0 4px 12px rgba(0,0,0,.28), inset 0 1px 2px rgba(255,255,255,.4);
    transition:transform .1s, background .2s, filter .2s, opacity .2s; }
  .hbtn .hb-ico{ display:flex; line-height:0; filter:drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
  .hbtn .hb-ico svg{ width:25px; height:25px; display:block; }
  .hbtn .hb-ct{ font-size:.68rem; font-weight:bold; line-height:1; margin-top:1px; text-shadow:0 1px 3px rgba(0,0,0,.55); }
  .hbtn:active{ transform:scale(.93); background:rgba(255,255,255,.28); }
  .hbtn.empty{ filter:grayscale(.5); opacity:.45; }

  /* 가로 회전 안내 (세로일 때) */
  #rotate{ position:fixed; inset:0; z-index:50; display:none; flex-direction:column; gap:14px;
    align-items:center; justify-content:center; background:#16261a; text-align:center; padding:30px; }
  #rotate.show{ display:flex; }
  #rotate .ph{ font-size:3.6rem; animation:rot 1.8s ease-in-out infinite; }
  @keyframes rot{ 0%,40%{transform:rotate(0)} 60%,100%{transform:rotate(-90deg)} }

  /* ===== 동행 선택 ===== */
  .ex-overlay{ position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:rgba(20,12,10,.8); padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  .ex-overlay.show{ display:flex; }
  .cs-panel{ background:linear-gradient(180deg,#3a2620,#2b1a16); border:2px solid var(--gold); border-radius:18px;
    padding:14px 16px; width:100%; max-width:700px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .cs-title{ color:var(--gold); font-size:1.2rem; margin-bottom:12px; }
  .cs-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .cs-card{ position:relative; background:rgba(255,253,245,.96); border:2px solid #b9a87e; border-radius:14px;
    padding:8px 6px; cursor:pointer; transition:transform .1s; overflow:hidden; }
  .cs-card:active{ transform:scale(.97); }
  .cs-card.selected{ border-color:var(--gold); box-shadow:0 0 12px rgba(255,179,0,.7); }
  .cs-card.locked{ cursor:default; }
  .cs-art{ height:86px; display:flex; align-items:flex-end; justify-content:center; }
  .cs-art img{ height:96px; object-fit:contain; }
  .cs-art .emoji{ font-size:3.4rem; }
  .cs-name{ font-weight:bold; color:#3a2620; font-size:1rem; margin-top:5px; }
  .cs-skill{ font-size:.76rem; color:#7a5a2a; margin-top:2px; min-height:1.1em; }
  .cs-selbadge{ position:absolute; top:6px; right:6px; background:var(--gold); color:#3a2620; font-size:.7rem; padding:1px 8px; border-radius:10px; font-weight:bold; }
  .cs-lockov{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
    color:#fff; font-size:.76rem; line-height:1.3; background:rgba(20,12,10,.62); border-radius:12px; }
  .cs-lockov .lk{ font-size:1.7rem; line-height:1; }
  .cs-lockov .lk .uic{ width:1.7rem; height:1.7rem; vertical-align:0; }
  .cs-art .uic{ width:44%; height:auto; opacity:.75; }
  .cs-close{ margin-top:14px; background:linear-gradient(180deg,#cfd8dc,#90a4ae); border:none; border-radius:12px;
    padding:9px 32px; font-family:inherit; font-size:1rem; color:#28323a; box-shadow:0 3px 0 #546e7a; }
  .cs-close:active{ transform:translateY(2px); box-shadow:0 1px 0 #546e7a; }
  /* ===== 스탯 & 장비 ===== */
  /* UI 아이콘(SVG) — 이모지 대체. 글자와 같은 줄에 자연스럽게 붙도록 */
  .uic{ width:1.15em; height:1.15em; vertical-align:-0.22em; display:inline-block; flex:0 0 auto; }
  .mi{ width:1.15em; height:1.15em; vertical-align:-0.22em; display:inline-block; object-fit:contain; margin-right:1px; }
  .st-chip .uic{ width:1.05em; height:1.05em; margin-right:2px; }
  .cs-skill .uic{ width:1em; height:1em; vertical-align:-0.15em; margin-right:2px; }
  .st-eqimg{ width:1.5em; height:1.5em; object-fit:contain; vertical-align:-0.4em; margin-right:1px; }
  .st-row{ display:flex; gap:9px; justify-content:center; flex-wrap:wrap; margin:8px 0; }
  .st-chip{ background:rgba(255,253,245,.96); border-radius:12px; padding:7px 14px; color:#3a2620; font-weight:bold; font-size:.95rem; }
  .st-chip small{ color:#2e7d32; font-weight:bold; }
  .st-exp{ height:12px; background:#5a4632; border-radius:7px; overflow:hidden; max-width:320px; margin:5px auto 2px; }
  .st-exp > div{ height:100%; background:linear-gradient(90deg,#9ccc65,#43a047); transition:width .3s; }
  .st-expt{ font-size:.76rem; color:#cdbf9e; }
  .st-pass{ font-size:.9rem; color:#e8dcc4; margin:8px 0 2px; }
  .st-sec{ color:var(--gold); font-size:1rem; margin:13px 0 6px; text-align:left; padding-left:4px; }
  /* 조합소 보유 재료 스트립 */
  .cm-label{ color:#e8d8b0; font-size:.82rem; font-weight:bold; margin:2px 2px 6px; }
  .cm-wrap{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:14px; padding-bottom:12px; border-bottom:1px dashed #6a5640; }
  .cm-chip{ display:flex; align-items:center; gap:6px; background:rgba(255,253,245,.96); border:1.5px solid #b9a87e; border-radius:11px; padding:5px 10px 5px 6px; }
  .cm-chip .cm-ic{ width:24px; height:24px; object-fit:contain; }
  .cm-chip .cm-nm{ font-size:.8rem; color:#5a4326; font-weight:bold; }
  .cm-chip .cm-ct{ font-size:.82rem; font-weight:900; color:#2e7d32; min-width:16px; text-align:right; }
  .cm-chip.rare{ border-color:var(--gold); background:linear-gradient(180deg,#fff8e1,#ffeaa7); }
  .eq-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  .eq-card{ background:rgba(255,253,245,.96); border:2px solid #b9a87e; border-radius:12px; padding:8px 10px; text-align:left; display:flex; align-items:center; gap:9px; }
  .eq-card.equipped{ border-color:var(--gold); box-shadow:0 0 9px rgba(255,179,0,.55); }
  .cr-ic{ width:38px; height:38px; object-fit:contain; display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
  .cr-ic.sm{ width:1.35em; height:1.35em; display:inline-block; vertical-align:-0.32em; margin-right:2px; }
  .eq-ic{ font-size:1.7rem; width:38px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .eq-ic svg{ width:36px; height:36px; display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.25)); }
  .eq-ic img{ width:40px; height:40px; object-fit:contain; display:block; filter:drop-shadow(0 1px 1px rgba(0,0,0,.28)); }
  .eq-info{ flex:1; min-width:0; } .eq-info .nm{ font-weight:bold; color:#3a2620; font-size:.92rem; }
  .eq-info .bn{ font-size:.76rem; color:#2e7d32; } .eq-info .ct{ font-size:.72rem; color:#b06a1e; }
  .eq-btn{ border:none; border-radius:10px; padding:8px 13px; font-family:inherit; font-weight:bold; font-size:.85rem; cursor:pointer; white-space:nowrap; }
  .eq-btn.buy{ background:linear-gradient(180deg,#ffe7a8,#ffc34d); box-shadow:0 3px 0 #a9740f; color:#5a3a10; }
  .eq-btn.equip{ background:linear-gradient(180deg,#a5d6a7,#66bb6a); box-shadow:0 3px 0 #2e7d32; color:#15351a; }
  .eq-btn.on{ background:#cfd8dc; color:#546e7a; box-shadow:none; }
  .eq-btn:disabled{ opacity:.45; box-shadow:none; }
  /* ===== 스펠링 조합 퀴즈 ===== */
  #sp-panel.shake{ animation:bshake .3s; }
  .sp-head{ color:var(--gold); font-size:1.12rem; margin-bottom:6px; }
  .sp-prompt{ color:#fff8e1; font-size:1.05rem; margin-bottom:14px; }
  .sp-prompt b{ color:#ffd54f; }
  .sp-slots{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:16px; min-height:50px; }
  .sp-slot{ width:40px; height:50px; border-radius:9px; background:rgba(255,255,255,.1); border:2px dashed rgba(255,255,255,.32);
    display:flex; align-items:center; justify-content:center; font-size:1.5rem; font-weight:bold; color:#fff; }
  .sp-slot.filled{ background:rgba(255,253,245,.96); border-style:solid; border-color:var(--gold); color:#3a2620; cursor:pointer; }
  .sp-tiles{ display:flex; gap:7px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; min-height:52px; }
  .sp-tile{ width:42px; height:52px; border-radius:11px; background:linear-gradient(180deg,#ffe7a8,#ffc34d); box-shadow:0 4px 0 #a9740f;
    border:none; font-size:1.5rem; font-weight:bold; color:#5a3a10; cursor:pointer; font-family:inherit; }
  .sp-tile:active{ transform:translateY(2px); box-shadow:0 2px 0 #a9740f; }
  .sp-tile.used{ visibility:hidden; }
  .sp-msg{ min-height:1.5em; font-size:.96rem; margin-bottom:12px; color:#e8dcc4; }
  .sp-msg.ok{ color:#9ccc65; font-weight:bold; } .sp-msg.no{ color:#ef9a9a; }
  .sp-btns{ display:flex; gap:9px; justify-content:center; }
  .sp-act{ border:none; border-radius:12px; padding:10px 20px; font-family:inherit; font-size:1rem; font-weight:bold; cursor:pointer; }
  .sp-act.cancel{ background:linear-gradient(180deg,#cfd8dc,#90a4ae); color:#28323a; box-shadow:0 3px 0 #546e7a; }
  .sp-act.clear{ background:linear-gradient(180deg,#e0d2b0,#c9b48a); color:#4e342e; box-shadow:0 3px 0 #9c7d4a; }
  .sp-act.ok{ background:linear-gradient(180deg,#a5d6a7,#66bb6a); color:#15351a; box-shadow:0 3px 0 #2e7d32; }
  .sp-act:active{ transform:translateY(2px); }

  /* ===== 전투 (포켓몬식 가로 구도) ===== */
  #battle{ position:fixed; inset:0; z-index:20; display:none; flex-direction:column; }
  #battle.show{ display:flex; }
  .b-arena{ flex:1; position:relative; overflow:hidden;
    background:#cdeef0 url('scenes/forest.png') center/cover no-repeat; }  /* [에셋] 원두 숲 전투 배경 */
  .b-arena.shake{ animation:bshake .28s; }
  @keyframes bshake{ 0%,100%{transform:translate(0,0)} 25%{transform:translate(-6px,3px)} 50%{transform:translate(6px,-3px)} 75%{transform:translate(-4px,-2px)} }
  /* [에셋] 배경 이미지에 실제 나무·안개가 있으므로 CSS 나무/안개 레이어는 숨김 */
  .b-trees, .b-fog{ display:none; }
  /* 깊은 숲(밤) 전투 배경 */
  .b-arena.zone-deepwood{ background:#161a40 url('scenes/deepwood.png') center/cover no-repeat; }
  /* [수정] 접지 그림자/플랫폼 제거 — 배경 이미지에 지면이 있어 불필요 */
  .platform{ display:none; }
  .plat-enemy{ width:40%; height:13%; top:40%; right:7%; }
  .plat-self{ width:46%; height:15%; bottom:2%; left:1%; }
  /* ===== [트랙A] 저비용 전투 연출(juice) — 에셋 없이 CSS/JS만 ===== */
  /* 근경 파스텔 안개(깊이감) */
  .b-fog{ position:absolute; left:0; right:0; bottom:0; height:28%; pointer-events:none; z-index:3;
    background:radial-gradient(ellipse 62% 100% at 50% 125%, rgba(255,255,255,.22), transparent 72%); }
  .b-arena.zone-deepwood .b-fog{ background:radial-gradient(ellipse 62% 100% at 50% 125%, rgba(150,170,255,.14), transparent 72%); }
  /* 비네트(가장자리 어둡게 → 시선을 중앙 캐릭터로) + 존별 톤 */
  .b-vignette{ position:absolute; inset:0; pointer-events:none; z-index:4;
    background:radial-gradient(ellipse 80% 72% at 50% 46%, transparent 56%, rgba(0,0,0,.26) 100%); mix-blend-mode:multiply; }
  .b-arena.zone-deepwood .b-vignette{ background:radial-gradient(ellipse 82% 74% at 50% 46%, transparent 54%, rgba(8,6,26,.34) 100%); }
  /* 잔향 항구(안개 항구) — 전용 배경 아트 전, CSS 그라디언트로 안개 낀 회색 항구 연출 + 안개 레이어 재활성 */
  .b-arena.zone-harbor{ background:linear-gradient(180deg,#39485c 0%,#495a6c 36%,#59636f 64%,#6a6970 100%); }
  .b-arena.zone-harbor::before{ content:''; position:absolute; inset:0; pointer-events:none; z-index:1;
    background:radial-gradient(ellipse 95% 55% at 50% 14%, rgba(190,208,224,.30), transparent 72%),
               radial-gradient(ellipse 60% 30% at 22% 78%, rgba(210,220,232,.14), transparent 70%); }
  .b-arena.zone-harbor .b-fog{ display:block; background:radial-gradient(ellipse 82% 100% at 50% 122%, rgba(202,216,230,.24), transparent 74%); }
  .b-arena.zone-harbor .b-vignette{ background:radial-gradient(ellipse 82% 74% at 50% 46%, transparent 52%, rgba(18,26,40,.40) 100%); }
  /* [에셋] 봉인고(최종) — 갇힌 말들이 잠든 검은 큐레이터의 진열장(bg_vault_interior 재사용, 워터마크 제거) */
  .b-arena.zone-vault{ background:#1c1a26 url('scenes/vault.png') center/cover no-repeat; }

     "세짐"이 즉시 보이게. filter는 host 하나에만 걸어 모든 하위 파티클/링에 일괄 적용된다. */

  .q-panel{ position:absolute; left:50%; bottom:16px; transform:translateX(-50%); width:min(94%,600px); z-index:2; background:linear-gradient(180deg,#fffdf7,#fff2d8); border:3px solid #caa26a; border-radius:18px; padding:12px 18px 14px; box-shadow:0 8px 24px rgba(0,0,0,.45); text-align:center; font-family:'Jua','Nunito',sans-serif; }
  .q-name{ display:inline-block; background:linear-gradient(180deg,#c79a5a,#a6763a); color:#fff8ea; font-size:1rem; font-weight:bold; padding:3px 16px; border-radius:14px; margin-bottom:8px; box-shadow:0 2px 0 rgba(0,0,0,.2); }

  .q-btn.ok{ background:linear-gradient(180deg,#ffcf6b,#f2a63d); color:#5b3b1a; }
  .q-btn.ghost{ background:#e7dcc6; color:#6b5334; }
  .q-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.25); }
  .lvlup{ color:#e0761f; font-weight:bold; }
  /* ===== 어둠의 상인 대결 ===== */
  .dm-box{ width:min(90%,460px); background:linear-gradient(180deg,#2a2340,#191428); border:3px solid #6a4fb0; border-radius:20px; padding:16px; box-shadow:0 12px 34px rgba(0,0,0,.6), 0 0 24px rgba(120,80,220,.4); text-align:center; font-family:'Jua','Nunito',sans-serif; color:#efe8ff; }
  .dm-top{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .dm-portrait{ width:78px; height:108px; border-radius:12px; object-fit:contain; object-position:bottom center; filter:brightness(.92) contrast(1.05) drop-shadow(0 3px 5px rgba(0,0,0,.45)); flex:none; }
  .dm-title{ font-size:1.15rem; font-weight:bold; color:#c9b4ff; text-shadow:0 0 8px rgba(150,110,255,.6); }
  .dm-say{ font-size:1rem; line-height:1.55; margin-bottom:14px; }
  .dm-say.win{ color:#ffe08a; }
  .dm-acts{ display:flex; gap:8px; justify-content:center; }
  .dm-prog{ font-size:.85rem; color:#b6a6e0; margin-bottom:8px; }
  .dm-word{ font-size:2rem; font-weight:bold; letter-spacing:1px; color:#fff; margin:6px 0; text-shadow:0 2px 10px rgba(150,110,255,.7); }
  .dm-hint{ font-size:.85rem; color:#a99bd0; margin-bottom:12px; }
  .dm-opts{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .dm-opt{ background:#3a2f58; border:2px solid #5a4a86; color:#efe8ff; border-radius:13px; padding:12px 8px; font-family:inherit; font-size:.95rem; font-weight:bold; cursor:pointer; transition:transform .08s; }
  .dm-opt:active{ transform:scale(.96); }
  .dm-opt.correct{ background:#2e7d46; border-color:#54c877; color:#fff; }
  .dm-opt.wrong{ background:#8d2f38; border-color:#d85b66; color:#fff; }
  #battle.intro .binfo, #battle.intro .b-cmds{ opacity:0; pointer-events:none; }
  .lvlup{ color:#ffd54f; }
  /* ===== 시네마틱 CG 오버레이 (어둠의 상인 결투 인트로 등) ===== */
  #ex-cutscene{ position:fixed; inset:0; z-index:900; background:#000; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .45s ease; }
  #ex-cutscene.csc-show{ opacity:1; pointer-events:auto; }
  #ex-cutscene.csc-hidden{ display:none; }
  #ex-cutscene .csc-blur{ position:absolute; inset:-8%; background-size:cover; background-position:center; filter:blur(26px) brightness(.38); transform:scale(1.12); }
  #ex-cutscene .csc-img{ position:relative; width:100%; max-height:100%; object-fit:contain; box-shadow:0 0 44px rgba(0,0,0,.55); animation:excscZoom 6.5s ease-out both; }
  @keyframes excscZoom{ from{ transform:scale(1.05); } to{ transform:scale(1); } }
  #ex-cutscene .csc-caption{ position:absolute; left:0; right:0; bottom:0; padding:64px 26px calc(38px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, rgba(0,0,0,.86)); color:#fff; font-size:1.05rem; font-weight:700; line-height:1.5; text-align:center; text-shadow:0 2px 10px rgba(0,0,0,.85); font-family:'Jua','Nunito',sans-serif; }
  #ex-cutscene .csc-hint{ position:absolute; right:18px; bottom:calc(14px + env(safe-area-inset-bottom)); color:rgba(255,255,255,.72); font-size:.82rem; animation:excscBlink 1.4s ease-in-out infinite; }
  @keyframes excscBlink{ 0%,100%{opacity:.35;} 50%{opacity:.9;} }
</style>

// ===== 탐험 BGM =====
// 네이티브(AppDelegate)가 백그라운드 전환 직전에 호출 — 최상위 const라 window.ExploreBgm은 없다.
window.__vbReleaseAudio = function(){ try{ ExploreBgm.hardStop(); }catch(e){} };
const ExploreBgm = {
  // ★ Web Audio API 기반(index.html의 BgMusic과 같은 이유·같은 방식).
  // <audio>는 iOS 잠금화면 Now Playing에 등록돼 앱을 꺼도 남는다. AudioContext는 안 남는다.
  _tracks: {
    map:    'bgm/explore.mp3',
    battle: 'bgm/battle.mp3',
    boss:   'bgm/boss.mp3',
    craft:  'bgm/craft.mp3',
  },
  isMuted: false,
  _current: null,
  _ctx: null, _buf: {}, _lru: [], _MAXBUF: 3,
  _src: null, _gain: null, _playToken: 0, _released: false,

  _ac() {
    if(!this._ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      this._ctx = new AC();
    }
    return this._ctx;
  },
  _touch(k){ const i=this._lru.indexOf(k); if(i>=0) this._lru.splice(i,1); this._lru.push(k); },
  _put(k,buf){
    this._buf[k]=buf; this._touch(k);
    while(this._lru.length > this._MAXBUF){
      const d=this._lru.shift();
      if(d !== this._current) delete this._buf[d]; else this._lru.push(d);
    }
  },
  _load(url,key){
    if(this._buf[key]){ this._touch(key); return Promise.resolve(this._buf[key]); }
    const ctx=this._ac(); if(!ctx) return Promise.reject(new Error('no AudioContext'));
    return fetch(url).then(r=>r.arrayBuffer()).then(ab=>new Promise((res,rej)=>{
      const p=ctx.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res).catch(rej);
    })).then(buf=>{ this._put(key,buf); return buf; });
  },
  _stopSrc(){
    if(this._src){ try{this._src.stop();}catch(e){} try{this._src.disconnect();}catch(e){} this._src=null; }
    if(this._gain){ try{this._gain.disconnect();}catch(e){} this._gain=null; }
  },

  init() {
    const saved = localStorage.getItem('vb_bgm_mute');
    this.isMuted = (saved === 'true');
    this._current = 'map';
    const self = this;
    if(!this.isMuted) this.play('map');
    // AudioContext는 사용자 제스처 후에만 소리가 난다
    const resumeOnInteraction = () => {
      const ctx = self._ac();
      if(ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
      if(!self.isMuted && self._current && !self._src) self.play(self._current);
      document.removeEventListener('click', resumeOnInteraction, true);
      document.removeEventListener('touchstart', resumeOnInteraction, true);
    };
    document.addEventListener('click', resumeOnInteraction, true);
    document.addEventListener('touchstart', resumeOnInteraction, true);
    document.addEventListener('visibilitychange', () => {
      if(document.hidden) self.hardStop(); else self.restore();
    });
    window.addEventListener('pagehide', () => self.hardStop());
    try {
      const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
      if(App) App.addListener('appStateChange', st => { if(!st.isActive) self.hardStop(); else self.restore(); });
    } catch(e) {}
  },

  play(key) {
    if(!this._tracks[key]) return;
    if(this._current === key && this._src) return;
    this._current = key;
    if(this.isMuted) return;
    const ctx = this._ac(); if(!ctx) return;
    if(ctx.state === 'suspended') ctx.resume().catch(()=>{});
    const token = ++this._playToken;
    this._load(this._tracks[key], key).then(buf => {
      if(token !== this._playToken || this.isMuted) return;
      this._stopSrc();
      const src = ctx.createBufferSource();
      src.buffer = buf; src.loop = true;
      const g = ctx.createGain(); g.gain.value = 0.35;
      src.connect(g); g.connect(ctx.destination);
      try { src.start(0); } catch(e) {}
      this._src = src; this._gain = g;
    }).catch(()=>{});
  },

  // 백그라운드: 소리를 끊고 컨텍스트를 재운다(붙들 미디어 리소스가 없다)
  hardStop() {
    this._stopSrc();
    const ctx = this._ctx;
    if(ctx && ctx.state === 'running'){ try{ ctx.suspend(); }catch(e){} }
    this._released = true;
  },
  restore() {
    if(!this._released) return;
    this._released = false;
    const ctx = this._ctx;
    if(ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
    if(!this.isMuted && this._current) this.play(this._current);
  },

  stop() { this._stopSrc(); },
};

const CAFE_KEY='vb_save_v7', EXPLORE_KEY='vb_explore_v1';

const SaveBridge = {
  loadCafe(){ try{ return JSON.parse(localStorage.getItem(CAFE_KEY))||{}; }catch(e){ return {}; } },
  patchCafe(p){ let c={}; try{ c=JSON.parse(localStorage.getItem(CAFE_KEY))||{}; }catch(e){} Object.assign(c,p); localStorage.setItem(CAFE_KEY,JSON.stringify(c)); },
  loadExplore(){ let ex={}; try{ ex=JSON.parse(localStorage.getItem(EXPLORE_KEY))||{}; }catch(e){}
    return { level:ex.level||1, exp:ex.exp||0,
      stats:Object.assign({maxHp:30,hp:30,atk:8,def:4},ex.stats||{}),
      equip:Object.assign({weapon:null,armor:null},ex.equip||{}),
      materials:ex.materials||{}, items:ex.items||[], companion:ex.companion||'none',
      map:ex.map||{zone:'forest'}, pos:ex.pos||null, steps:ex.steps||0,
      quests:ex.quests||{}, questN:ex.questN||{}, events:ex.events||{}, explored:ex.explored||{}, maps:ex.maps||{}, zoneBoss:ex.zoneBoss||{}, monstersSeen:ex.monstersSeen||{},
      skillTier:(ex.skillTier&&typeof ex.skillTier==='object')?ex.skillTier:{} }; },  // 동행별 스킬 진화 티어(0~3)
  saveExplore(s){ localStorage.setItem(EXPLORE_KEY,JSON.stringify(s)); },
};

// 효과음 + 햅틱 (카페의 음소거 설정 공유) — 탐험이 무음이던 문제 보완
const Sfx = {
  ctx:null, muted:false,
  init(){ try{ this.muted = !!SaveBridge.loadCafe().isMuted; }catch(e){} },
  _ac(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
    if(this.ctx.state==='suspended') this.ctx.resume(); return this.ctx; },
  tone(freq, dur, type, vol){ if(this.muted) return; const ac=this._ac(); if(!ac) return;
    const o=ac.createOscillator(), g=ac.createGain(); o.connect(g); g.connect(ac.destination);
    const now=ac.currentTime; o.type=type||'sine'; o.frequency.setValueAtTime(freq, now);
    g.gain.setValueAtTime(vol||0.18, now); g.gain.exponentialRampToValueAtTime(0.0001, now+(dur||0.15));
    o.start(now); o.stop(now+(dur||0.15)); },
  play(kind){
    switch(kind){
      case 'gather': this.tone(660,0.1,'sine',0.16); setTimeout(()=>this.tone(990,0.12,'sine',0.16),70); break;
      case 'hit':    this.tone(180,0.1,'square',0.14); break;
      case 'crit':   this.tone(140,0.16,'sawtooth',0.2); setTimeout(()=>this.tone(280,0.12,'square',0.16),60); break;
      case 'miss':   this.tone(200,0.12,'sine',0.1); break;
      case 'enemy':  this.tone(120,0.12,'sawtooth',0.13); break;
      case 'win':    [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,0.16,'sine',0.18),i*90)); break;
      case 'levelup':[659,880,1318].forEach((f,i)=>setTimeout(()=>this.tone(f,0.18,'triangle',0.18),i*100)); break;
      case 'correct':this.tone(523,0.1,'sine',0.16); setTimeout(()=>this.tone(1046,0.14,'sine',0.16),90); break;
      case 'wrong':  this.tone(160,0.22,'sawtooth',0.16); break;
    }
  }
};
function exHaptic(kind){
  try { const H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Haptics;
    if(H){ if(kind==='success')H.notification({type:'SUCCESS'}); else if(kind==='heavy')H.impact({style:'HEAVY'}); else H.impact({style:'LIGHT'}); return; } } catch(e){}
  if(navigator.vibrate) navigator.vibrate(kind==='heavy'?60:kind==='success'?[30,40,30]:15);
}

const Explore = {
  cafe:null, state:null,
  init(){
    const c=SaveBridge.loadCafe();
    this.cafe={ wallet:c.wallet||0, myWords:Array.isArray(c.myWords)?c.myWords:[], turnCount:c.turnCount||0,
                collectedChars:Array.isArray(c.collectedChars)?c.collectedChars:[],
                craftedItems:(c.craftedItems&&typeof c.craftedItems==='object')?c.craftedItems:{},
                // ★ 동행 채용 판정(isRecruited)이 호감도를 본다 — 이걸 빠뜨려 호감도 MAX여도 항상 잠겨 있었다.
                affection:(c.affection&&typeof c.affection==='object')?c.affection:{},
                // [버그수정] 탐험 SRS 졸업 단어를 카페 마스터 도감에 반영하기 위해 현재 목록을 적재(빠지면 탐험 졸업이 도감에서 유실).
                masteredList:Array.isArray(c.masteredList)?c.masteredList:[],
                // [울림지수] 학습→전투력% 계산용 통계(누적 정답/오답). 없을 수 있어 가드.
                stats:(c.stats&&typeof c.stats==='object')?c.stats:{},
                masteredCount:(typeof c.masteredCount==='number')?c.masteredCount:(Array.isArray(c.masteredList)?c.masteredList.length:0) };
    this.state=SaveBridge.loadExplore();
    if(!this.isRecruited(this.state.companion)) this.state.companion='none';  // 미채용 동행은 기본으로
    Sfx.init();
    Assets.preloadAll();
    this.refreshHUD();
    lockLandscape();
    World.init();
    World.updateCompChip();
    // [스토리 보스] 카페 봉인고 막에서 넘어왔으면 지도 탐험 없이 바로 드미타스 결전
    try{ if(localStorage.getItem('vb_story_boss')==='demitas'){ localStorage.removeItem('vb_story_boss'); setTimeout(function(){ Battle.startDemitasBoss(); }, 350); } }catch(e){}
  },
  persist(){ SaveBridge.patchCafe({ wallet:this.cafe.wallet, myWords:this.cafe.myWords, turnCount:this.cafe.turnCount, craftedItems:this.cafe.craftedItems, masteredList:this.cafe.masteredList }); SaveBridge.saveExplore(this.state); },
  // 스펠링 조합 정답 시 SRS 갱신(오답노트 단어면 박스↑, 졸업하면 제거)
  srsCorrect(word){ const arr=this.cafe.myWords||[]; const v=arr.find(x=>x.w&&x.w.toLowerCase()===word);
    if(v){ v.box=(v.box||1)+1; v.due=(this.cafe.turnCount||0)+(v.box*2);
      if(v.box>=5){ this.cafe.myWords=arr.filter(x=>x!==v);
        // [버그수정] 졸업 단어를 카페 마스터 도감에도 반영(예전엔 오답노트에서 빼기만 해 크레딧·도감 유실).
        if(!Array.isArray(this.cafe.masteredList)) this.cafe.masteredList=[];
        if(this.cafe.masteredList.indexOf(v.w)<0) this.cafe.masteredList.push(v.w);
      }
      this.persist(); } },
  // 채용 여부: 카페 손님 도감에 해당 메인 캐릭터가 등록(=만난 적 있음)되면 동행 가능
  // 동행 채용: 카페에서 그 메인 캐릭터 호감도를 MAX(100)까지 올려야 가능
  isRecruited(key){ if(!key||key==='none') return true; const c=COMPANIONS[key]; if(!(c&&c.charId)) return false;
    const aff=(this.cafe&&this.cafe.affection&&this.cafe.affection[c.charId])||0; return aff>=100; },
  // 장비+동행 패시브 보너스 합산
  effBonus(){ const b={maxHp:0,atk:0,def:0,goldPct:0}; const eq=this.state.equip||{};
    ['weapon','armor'].forEach(slot=>{ const it=(EQUIP_DB[slot]||[]).find(x=>x.id===eq[slot]); if(it){ b.atk+=it.atk||0; b.def+=it.def||0; b.maxHp+=it.hp||0; } });
    const p=COMP_PASSIVE[this.state.companion||'none']; if(p){ b.atk+=p.atk||0; b.def+=p.def||0; b.maxHp+=p.maxHp||0; b.goldPct+=p.goldPct||0; }
    return b; },
  // [울림지수] 누적 학습 → 전투력 가산%(로그상한). 재미우선: 강제·페널티 없음, 안 해도 클리어됨. 상한으로 무력화 방지.
  //   M=마스터 단어수→공격% / A=최근40문 정답률→크리% / R=오답정복(SRS졸업)→방어% / S=스펠링(직접입력)성공→게이지속도%
  vocabPower(){
    const c=this.cafe||{};
    const M=(typeof c.masteredCount==='number'?c.masteredCount:(c.masteredList||[]).length)||0;
    const st=c.stats||{};
    const ra=Array.isArray(st.recentAnswers)?st.recentAnswers:[];                    // [A] 최근 40문 윈도우(생애누적 대체)
    const A=ra.length? ra.reduce((a,b)=>a+b,0)/ra.length : 0;
    const R=st.srsGraduated||0;                                                       // [R] 오답정복(SRS 졸업) 누적
    const S=st.vipCorrect||0;                                                         // [S] 스펠링(직접입력) 성공 누적
    const atkPct=0.30*(1-Math.exp(-M/60));                 // 공격 ≤ +30%
    const critBonus=0.15*Math.max(0,(A-0.5)/0.5);          // 크리 ≤ +15%p (정답률 50%↓는 0 — 페널티 아님)
    const defPct=0.25*(1-Math.exp(-R/45));                 // 방어 ≤ +25%
    const gaugePct=0.40*(1-Math.exp(-S/50));               // 게이지속도 ≤ +40%
    return { M, A, R, S, atkPct, critBonus, defPct, gaugePct, pct:Math.round(atkPct*100) };
  },
  effStats(){ const s=this.state.stats; const b=this.effBonus(); const vp=this.vocabPower(); const maxHp=s.maxHp+b.maxHp;
    return { hp:Math.min(s.hp,maxHp), maxHp,
             atk:Math.round((s.atk+b.atk)*(1+vp.atkPct)),   // 울림 공격% 반영
             def:Math.round((s.def+b.def)*(1+vp.defPct)),   // 울림 방어%(R=오답정복)
             base:s, bonus:b, vocab:vp }; },
  exitToCafe(){ this.persist(); try{ unlockOrientation(); }catch(e){}
    try{ localStorage.setItem('vb_resume_paused','1'); }catch(e){} // 카페 복귀 시 일시정지 화면으로
    location.href='index.html'; },
  refreshHUD(){
    const s=this.state,c=this.cafe;
    document.getElementById('hud-gold').textContent=c.wallet;
    document.getElementById('hud-level').textContent=s.level;
    const e=this.effStats(); document.getElementById('hud-hp').textContent=e.hp+'/'+e.maxHp;
    // [울림지수] 학습→전투력% 표기(대표=공격%). 크리/방어/게이지 보너스가 있으면 함께 표기, 툴팁엔 4축 전부.
    const vn=document.getElementById('hud-vocab-n'); if(vn){ const vp=e.vocab||this.vocabPower();
      const cr=Math.round(vp.critBonus*100), dp=Math.round(vp.defPct*100), gp=Math.round(vp.gaugePct*100);
      vn.textContent='+'+vp.pct+'%'+(cr>0?' · 크리+'+cr:'')+(dp>0?' · 방어+'+dp:'')+(gp>0?' · 가속+'+gp:'');
      const chip=document.getElementById('hud-vocab'); if(chip) chip.title='울림 지수 — 공격 +'+vp.pct+'% · 크리 +'+cr+'%p · 방어 +'+dp+'% · 게이지속도 +'+gp+'%'; }
    // 맵 회복 버튼: 보유 개수 / 비활성 상태 갱신
    const hr=CRAFT_DB.find(x=>x.effect==='heal'); const hn=hr?((c.craftedItems||{})[hr.id]||0):0;
    const hc=document.getElementById('heal-ct'), hb=document.getElementById('heal-btn');
    if(hc) hc.textContent=hn; if(hb) hb.classList.toggle('empty', hn<=0);
  },
  // 회복 물약 사용(맵 이동 중) — 전투 밖에서 체력 회복
  useHealItem(){
    const owned=this.cafe.craftedItems||{}; const r=CRAFT_DB.find(x=>x.effect==='heal');
    const e=this.effStats();
    if(e.hp>=e.maxHp){ if(window.World) World.toast(`이미 체력이 가득해요 ${UI_ICON.hp}`); return; }
    if(!r || !((owned[r.id]||0)>0)){ if(window.World) World.toast(`회복 물약이 없어요 ${UI_ICON.heal}<br><span class="ko">조합소에서 만들 수 있어요</span>`); return; }
    owned[r.id]--; if(owned[r.id]<=0) delete owned[r.id]; this.cafe.craftedItems=owned;
    const before=this.state.stats.hp;
    this.state.stats.hp=Math.min(e.maxHp, before+Math.round(e.maxHp*(r.healPct||0.4)));
    const g=this.state.stats.hp-before;
    this.persist(); this.refreshHUD();
    if(window.World) World.toast(`${UI_ICON.heal} <b>회복 물약</b> — 체력 <b>${g}</b> 회복`);
    if(window.Sfx) Sfx.play('gather'); if(window.exHaptic) exHaptic('success');
  },
  // 경험치 획득 + 레벨업(전투 win 로직과 동일 규칙) — 퀘스트·이벤트 보상용
  gainExp(n){ this.state.exp=(this.state.exp||0)+n; let ups=0;
    while(this.state.exp>=expNeed(this.state.level)){ this.state.exp-=expNeed(this.state.level); this.state.level++;
      const st=this.state.stats; st.maxHp+=8; st.atk+=3; st.def+=2; st.hp=st.maxHp; ups++; }
    return ups; },
  // [개발용 치트] 골드 1번 → 레벨 2번 → 체력 3번 → 레벨 2번, 순서대로 탭(3.5초 안에) — 레벨업 노가다 없이 밸런스 테스트하려고
  _cheatSeq:[], _cheatSeqT:0,
  _cheatCode:['gold','level','level','hp','hp','hp','level','level'],
  cheatChipTap(chip){
    const now=Date.now();
    if(now - (this._cheatSeqT||0) > 3500) this._cheatSeq = [];
    this._cheatSeqT = now;
    this._cheatSeq.push(chip);
    const need=this._cheatCode.length;
    if(this._cheatSeq.length > need) this._cheatSeq = this._cheatSeq.slice(-need);
    if(this._cheatSeq.length === need && this._cheatSeq.every((v,i)=>v===this._cheatCode[i])){
      this._cheatSeq = []; this.cheatBoost();
    }
  },
  cheatBoost(){
    for(let i=0;i<5;i++){ this.state.level++; const st=this.state.stats; st.maxHp+=8; st.atk+=3; st.def+=2; }
    this.state.stats.hp = this.state.stats.maxHp;
    this.cafe.wallet = (this.cafe.wallet||0) + 5000;
    this.persist(); this.refreshHUD();
    if(window.World) World.toast(`${UI_ICON.spark||''} <b>치트 발동</b> — Lv +5 · 체력 풀회복 · ${UI_ICON.coin||''}+5000`);
    if(window.Sfx) Sfx.play('levelup'); if(window.exHaptic) exHaptic('success');
  },
  // 보상 지급(골드/경험치/아이템) 공용 — 퀘스트·어둠의상인
  grantReward(rw){ let parts=[];
    if(rw.gold){ this.cafe.wallet=(this.cafe.wallet||0)+rw.gold; parts.push(`${UI_ICON.coin}+${rw.gold}`); }
    if(rw.exp){ const up=this.gainExp(rw.exp); parts.push(`${UI_ICON.exp}EXP+${rw.exp}`); if(up) parts.push(`${UI_ICON.party}Lv ${this.state.level}!`); }
    if(rw.item){ if(!this.cafe.craftedItems) this.cafe.craftedItems={}; this.cafe.craftedItems[rw.item]=(this.cafe.craftedItems[rw.item]||0)+1;
      const ci=(CRAFT_DB.find(x=>x.id===rw.item)||{}); parts.push(`${ci.id?craftIcon(ci,'cr-ic sm'):''}${ci.name||'아이템'}+1`); }
    if(rw.mat){ this.state.materials[rw.mat]=(this.state.materials[rw.mat]||0)+(rw.matCount||1); const m=MATERIALS[rw.mat]||{}; parts.push(`${MAT_ICON[rw.mat]||''}${m.name||rw.mat}+${rw.matCount||1}`); }
    this.refreshHUD(); this.persist(); return parts.join(' · '); },
};

// ---------- 화면 방향 ----------
async function lockLandscape(){
  try{ const P=window.Capacitor&&window.Capacitor.Plugins; if(P&&P.ScreenOrientation) await P.ScreenOrientation.lock({orientation:'landscape'}); }catch(e){}
  try{ if(screen.orientation&&screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){}
}
async function unlockOrientation(){
  try{ const P=window.Capacitor&&window.Capacitor.Plugins; if(P&&P.ScreenOrientation) await P.ScreenOrientation.lock({orientation:'portrait'}); }catch(e){}
  try{ if(screen.orientation&&screen.orientation.unlock) screen.orientation.unlock(); }catch(e){}
}

function applyOrientation(){
  const rot = document.getElementById('rotator'); if(!rot) return;
  const portrait = window.innerHeight > window.innerWidth;
  if(portrait){
    document.body.classList.add('rot');
    rot.style.width  = window.innerHeight+'px';
    rot.style.height = window.innerWidth+'px';
    rot.style.transformOrigin = 'top left';
    rot.style.transform = 'rotate(90deg) translateY(-'+window.innerWidth+'px)';
  } else {
    document.body.classList.remove('rot');
    rot.style.width=''; rot.style.height=''; rot.style.transform=''; rot.style.transformOrigin='';
  }
  if(window.World && World.resize) World.resize();
}

const Assets = {
  imgs:{},
  load(src){ if(!src) return null; if(this.imgs[src]) return this.imgs[src]; const i=new Image(); i.src=src; this.imgs[src]=i; return i; },
  ready(src){ const i=this.imgs[src]; return !!(i&&i.complete&&i.naturalWidth); },
  preloadAll(){
    Object.values(MATERIALS).forEach(m=>this.load(m.img));
    Object.values(COMPANIONS).forEach(c=>{ this.load(c.img); this.load(c.battleImg); });
    Object.values(MONSTERS).forEach(m=>this.load(m.art));
    QUEST_NPCS.forEach(q=>{ this.load(q.img); if(q.portrait)this.load(q.portrait); }); this.load(DARK_MERCHANT.img); if(DARK_MERCHANT.portrait)this.load(DARK_MERCHANT.portrait);
  },

// ---------- 타일맵 엔진 (넓은 맵 + 카메라 추종 + 조이스틱) ----------
const TILESET_SRC = 'assets/tiny-town/Tilemap/tilemap_packed.png';
const TT_COLS = 12, TT_SIZE = 16;   // 타일셋: 12열, 16px

const World = {
  cv:null, ctx:null, sheet:null, ready:false,
  TS:42, dpr:1, viewW:0, viewH:0,
  WT:48, HT:34,                     // 월드 크기(타일)
  base:[], deco:[], barrier:null, trees:[], nodes:[],
  // 플레이어(월드 픽셀 좌표 = 타일중심 단위)
  px:0, py:0, bob:0, facing:1,
  // 조이스틱
  stick:{active:false,id:null,cx:0,cy:0,dx:0,dy:0},
  raf:null,

  init(){
    this.cv=document.getElementById('map'); this.ctx=this.cv.getContext('2d');
    this.sheet=new Image();
    this.sheet.onload=()=>{ this.ready=true; };
    this.sheet.src=TILESET_SRC;
    this.generate();
    // 위치 복원
    const p=Explore.state.pos;
    const valid = p && !this.isBarrier(Math.round(p.x), Math.round(p.y));
    this.px = valid ? p.x : this.start.x;
    this.py = valid ? p.y : this.start.y;
    this._portalArmed = true; this._riftArmed = true; this._gateArmed = true;
    this.updateZoneName();
    this.resize();
    window.addEventListener('resize', ()=>applyOrientation());
    window.addEventListener('orientationchange', ()=>setTimeout(applyOrientation, 80));
    window.addEventListener('keydown', e=>this.onKey(e));
    window.addEventListener('keyup',   e=>this.onKeyUp(e));
    this.bindStick();
    this.initMinimap(); this.reveal();
    applyOrientation();
    if(this.raf) cancelAnimationFrame(this.raf);
    this.loop();
  },

  // 시드 RNG (안정적 맵)
  _seed:20240624, rnd(){ this._seed=(this._seed*1103515245+12345)&0x7fffffff; return this._seed/0x7fffffff; },

  generate(){
    // 존별 시드/분위기 — 같은 코드로 존마다 다른 레이아웃·나무색
    const zone = ZONES[Explore.state.map.zone] || ZONES.forest;
    if(zone.arena) return this.generateArena(zone);   // [비밀 공간] 달의 뒷면 등 — 전용 생성기
    this._seed = 20240624 + (Explore.state.map.zone==='deepwood' ? 91237 : Explore.state.map.zone==='harbor' ? 55501 : Explore.state.map.zone==='vault' ? 77413 : Explore.state.map.zone==='moon' ? 33099 : 0);
    this._orangeRatio = zone.treeOrange || 0.3;
    this.barrier=new Set(); this.trees=[]; this.nodes=[]; this.base=[]; this.deco=[];
    for(let y=0;y<this.HT;y++){ this.base[y]=[]; this.deco[y]=[];
      for(let x=0;x<this.WT;x++){
        const r=this.rnd();
        this.base[y][x] = r<0.86?0 : (r<0.94?1:2);     // 풀 변형
        this.deco[y][x] = -1;
      }
    }
    const key=(x,y)=>x+','+y;
    // 테두리: 나무 벽
    for(let x=0;x<this.WT;x++){ this.addTree(x,0); this.addTree(x,1); this.addTree(x,this.HT-1); }
    for(let y=0;y<this.HT;y++){ this.addTree(0,y); this.addTree(this.WT-1,y); }
    // 나무 군집
    for(let i=0;i<70;i++){
      const cx=2+Math.floor(this.rnd()*(this.WT-4)), cy=3+Math.floor(this.rnd()*(this.HT-5));
      const n=1+Math.floor(this.rnd()*3);
      for(let j=0;j<n;j++){ const tx=cx+Math.floor(this.rnd()*3-1), ty=cy+Math.floor(this.rnd()*3-1);
        if(tx>1&&tx<this.WT-1&&ty>2&&ty<this.HT-1) this.addTree(tx,ty); }
    }
    // 풀 장식(걷기 가능)
    for(let i=0;i<60;i++){ const x=2+Math.floor(this.rnd()*(this.WT-4)), y=3+Math.floor(this.rnd()*(this.HT-5));
      if(!this.barrier.has(key(x,y))) this.deco[y][x]=[39,42,43][Math.floor(this.rnd()*3)]; }
    // 채집 노드
    const mats=GATHER_MATS;
    let placed=0, tries=0;
    while(placed<28 && tries<400){ tries++;
      const x=2+Math.floor(this.rnd()*(this.WT-4)), y=3+Math.floor(this.rnd()*(this.HT-5));
      if(this.barrier.has(key(x,y))) continue;
      if(this.nodes.some(n=>n.x===x&&n.y===y)) continue;
      const mat=mats[Math.floor(this.rnd()*mats.length)];
      this.nodes.push({x,y,mat,taken:false,reSteps:-1}); placed++;
    }
    // 시작/출구: 맵 하단 가장자리의 '마을로 가는 길' 게이트 — 위험지대 한가운데가 아니라 변두리에서 시작
    const gateX=Math.floor(this.WT/2);
    this.gate ={ x:gateX, y:this.HT-1 };   // 이 줄(하단 가장자리)을 밟으면 마을(카페)로
    this.start={ x:gateX, y:this.HT-7 };   // 입장/부활 시작점 — 팻말보다 위쪽(게이트와 거리 둬 즉시 재진입 방지)
    // 게이트~시작점 광장 비우기(나무/벽 제거)
    for(let yy=this.HT-8; yy<=this.HT-1; yy++)
      for(let dx=-2; dx<=2; dx++){ const xx=gateX+dx;
        if(xx<1||xx>=this.WT-1) continue;
        this.barrier.delete(key(xx,yy));
        this.trees=this.trees.filter(t=>!(t.x===xx&&t.y===yy)); }
    // 광장에 걸친 채집 노드는 제거(겹침 방지)
    this.nodes=this.nodes.filter(n=>!(Math.abs(n.x-gateX)<=2 && n.y>=this.HT-8));
    // 팻말 세우기(통과 불가) — 게이트 옆
    this.sign={ x:gateX-2, y:this.HT-4 };
    this.barrier.add(key(this.sign.x,this.sign.y));
    // 상단 가장자리: 다음 존(next, 레벨잠금)으로 가는 포털만 연다.
    //   되돌아가기(prev)는 이제 하단 게이트가 전담 — 위쪽에 중복 게이트를 두지 않는다.
    this.portals=[];
    const mkPortal=(target, portalX)=>{
      for(let yy=0; yy<=4; yy++) for(let dx=-2; dx<=2; dx++){ const xx=portalX+dx;
        if(xx<1||xx>=this.WT-1) continue; this.barrier.delete(key(xx,yy));
        this.trees=this.trees.filter(t=>!(t.x===xx&&t.y===yy)); }
      this.nodes=this.nodes.filter(n=>!(Math.abs(n.x-portalX)<=2 && n.y<=4));
      const signX=Math.max(1,portalX-2); this.barrier.add(key(signX,3));
      this.portals.push({ x:portalX, y:0, target, signX, signY:3 });
    };
    if(zone.next){ mkPortal(zone.next, Math.floor(this.WT/2)); }
    // ----- 퀘스트 NPC 배치(걷기 가능 지점, 주변 정리) -----
    this.npcs=[];
    const clearAround=(x,y,r)=>{ for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){ const xx=x+dx,yy=y+dy;
      if(xx<1||xx>=this.WT-1||yy<2||yy>=this.HT-1)continue; this.barrier.delete(key(xx,yy)); this.trees=this.trees.filter(t=>!(t.x===xx&&t.y===yy)); }
      this.nodes=this.nodes.filter(n=>!(Math.abs(n.x-x)<=r&&Math.abs(n.y-y)<=r)); };
    this.secret=null; this.forge=null; this.arenaBoss=null; this.gateBack=null;
    if(Explore.state.map.zone==='forest'){
      const spots=[ {x:Math.floor(this.WT*0.26), y:Math.floor(this.HT*0.34)},
                    {x:Math.floor(this.WT*0.72), y:Math.floor(this.HT*0.30)},
                    {x:Math.floor(this.WT*0.52), y:Math.floor(this.HT*0.60)} ];
      QUEST_NPCS.forEach((q,i)=>{ const sp=spots[i%spots.length]; clearAround(sp.x,sp.y,1);
        this.barrier.add(key(sp.x,sp.y)); this.npcs.push({ id:q.id, x:sp.x, y:sp.y }); });
      // ----- 대장간(장비 제작소): 시작 지역이라 초반부터 접근 가능. 건물에 와야만 제작 -----
      const fx=Math.floor(this.WT*0.40), fy=Math.floor(this.HT*0.44);
      // 건물(3타일 빌보드, 발끝접지)이 나무와 겹치지 않게 발자국 영역을 비대칭으로 정리(가로±2, 위2~아래3)
      for(let dy=-2; dy<=3; dy++) for(let dx=-2; dx<=2; dx++){
        const xx=fx+dx, yy=fy+dy; if(xx<1||xx>=this.WT-1||yy<2||yy>=this.HT-1) continue;
        this.barrier.delete(key(xx,yy));
        this.trees=this.trees.filter(t=>!(t.x===xx&&t.y===yy));
        this.nodes=this.nodes.filter(n=>!(n.x===xx&&n.y===yy));
      }
      this.barrier.add(key(fx,fy)); this.forge={ x:fx, y:fy };
    }
    if(Explore.state.map.zone==='deepwood'){
      // ----- 숨겨진 어둠의 상인(좌상단 비밀 공간, 진입로만 살짝 트여있음) — 깊은 숲에만 -----
      const sx=3, sy=3; clearAround(sx,sy,1);
      for(let yy=sy+2; yy<=Math.floor(this.HT*0.40); yy++){ this.barrier.delete(key(sx,yy)); this.trees=this.trees.filter(t=>!(t.x===sx&&t.y===yy)); } // 진입로
      this.barrier.add(key(sx,sy)); this.secret={ x:sx, y:sy };
    }
    this.rift=null;
    if(Explore.state.map.zone==='moon'){
      // ----- [숨은 길] 달 오른쪽 가장자리 — 그냥 바위벽인 줄 알았는데 한 칸이 비어 있다 -----
      //   벽(WT-1) 바로 안쪽 열을 세로로 길게 파서 '가장자리를 따라가는 좁은 복도'를 만든다.
      //   복도 끝(위쪽)에 맵 바깥으로 빠지는 '틈'(rift)이 있다 — 밟으면 달의 뒷면으로.
      //   ※지도 완성(90%) 판정이 있는 존이라 복도 자체는 늘 존재해야 한다(탐색률 일관성).
      //     대신 틈은 '가장 오래된 말'을 꺾기 전엔 열리지 않는다(tryRift에서 안내).
      const rx=this.WT-2, ryTop=3, ryBot=Math.floor(this.HT*0.72);
      for(let yy=ryTop; yy<=ryBot; yy++){ this.barrier.delete(key(rx,yy)); this.trees=this.trees.filter(t=>!(t.x===rx&&t.y===yy)); }
      // 복도 입구(아래쪽)만 맵 안쪽으로 살짝 트여 있어야 들어올 수 있다 — 그 외엔 벽에 붙은 한 줄
      for(let dx=1; dx<=2; dx++){ const xx=rx-dx; this.barrier.delete(key(xx,ryBot)); this.trees=this.trees.filter(t=>!(t.x===xx&&t.y===ryBot)); }
      this.nodes=this.nodes.filter(n=>!(n.x>=rx-2 && n.y>=ryTop && n.y<=ryBot));
      this.rift={ x:rx, y:ryTop };
    }
    // ----- 경로 이벤트(보물/선택/시련/흥정): 존별 고정 좌표, 완료한 건 배치 안 함 -----
    this.events=[];
    for(const def of EVENT_DEFS){
      if(def.zone!==Explore.state.map.zone) continue;
      if(typeof GameEvent!=='undefined' && GameEvent.done(def.id)) continue;   // 1회성 — 이미 겪었으면 생략
      const ex=Math.max(2, Math.min(this.WT-3, Math.round(this.WT*def.at.x)));
      const ey=Math.max(3, Math.min(this.HT-3, Math.round(this.HT*def.at.y)));
      clearAround(ex,ey,1);
      this.events.push({ id:def.id, x:ex, y:ey, def:def });
    }
    // 나무는 정적이므로 y정렬을 1회만(렌더 루프의 매 프레임 sort 제거 — 저사양 GC/CPU 절감)
    this.trees.sort((a,b)=>a.y-b.y);
    this.buildExplored();
  },
  // [비밀 공간 전용 생성기] 달의 뒷면 — 채집·이벤트·NPC·포털이 전부 없는 조용한 보스 무대.
  //   일반 generate()의 복잡한 배치를 타지 않고, 텅 빈 평원 + 아래쪽 '돌아가는 길'만 만든다.
  generateArena(zone){
    this._seed = 77713; this._orangeRatio = 0;
    this.barrier=new Set(); this.trees=[]; this.nodes=[]; this.base=[]; this.deco=[];
    this.npcs=[]; this.events=[]; this.portals=[]; this.secret=null; this.forge=null; this.rift=null;
    for(let y=0;y<this.HT;y++){ this.base[y]=[]; this.deco[y]=[];
      for(let x=0;x<this.WT;x++){ const r=this.rnd(); this.base[y][x]= r<0.86?0:(r<0.94?1:2); this.deco[y][x]=-1; } }
    const key=(x,y)=>x+','+y;
    for(let x=0;x<this.WT;x++){ this.addTree(x,0); this.addTree(x,1); this.addTree(x,this.HT-1); }
    for(let y=0;y<this.HT;y++){ this.addTree(0,y); this.addTree(this.WT-1,y); }
    // 성긴 바위 몇 개만 — 텅 빈 느낌을 유지하되 완전 평면은 아니게
    for(let i=0;i<26;i++){ const x=2+Math.floor(this.rnd()*(this.WT-4)), y=4+Math.floor(this.rnd()*(this.HT-9));
      if(Math.abs(x-Math.floor(this.WT/2))<=4 && y>=Math.floor(this.HT*0.22)-2) continue;   // 보스 앞은 비워둔다
      this.addTree(x,y); }
    const gx=Math.floor(this.WT/2);
    this.gate ={ x:gx, y:this.HT-1 };   // 아래쪽 = 달로 돌아가는 길(backTo)
    this.start={ x:gx, y:this.HT-6 };
    for(let yy=this.HT-7; yy<=this.HT-1; yy++) for(let dx=-2; dx<=2; dx++){ const xx=gx+dx;
      if(xx<1||xx>=this.WT-1) continue; this.barrier.delete(key(xx,yy)); this.trees=this.trees.filter(t=>!(t.x===xx&&t.y===yy)); }
    this.sign={ x:gx-2, y:this.HT-4 }; this.barrier.add(key(this.sign.x,this.sign.y));
    this.gateBack = zone.backTo || null;
    // 무대 안쪽 위 — 루나의 어둠이 서 있다(숨김 없이 '딱 보이게')
    const bx=gx, by=Math.floor(this.HT*0.22);
    for(let dy=-2; dy<=2; dy++) for(let dx=-3; dx<=3; dx++){ const xx=bx+dx, yy=by+dy;
      if(xx<1||xx>=this.WT-1||yy<2||yy>=this.HT-1) continue; this.barrier.delete(key(xx,yy)); this.trees=this.trees.filter(t=>!(t.x===xx&&t.y===yy)); }
    this.arenaBoss = World.bossCleared('lunashadow') ? null : { x:bx, y:by };
    if(this.arenaBoss) this.barrier.add(key(bx,by));
    this.trees.sort((a,b)=>a.y-b.y);
    this.buildExplored();
  },
  addTree(x,y){ const k=x+','+y; if(this.barrier.has(k))return; this.barrier.add(k);
    this.trees.push({x,y,type:this.rnd()<(1-(this._orangeRatio||0.3))?'green':'orange'}); },

  isBarrier(tx,ty){ if(tx<0||ty<0||tx>=this.WT||ty>=this.HT) return true; return this.barrier.has(tx+','+ty); },

  resize(){
    // 회전(세로기기) 상태면 가로로 돌린 영역 크기 사용
    const portrait = document.body.classList.contains('rot');
    const w = portrait ? window.innerHeight : window.innerWidth;
    const h = portrait ? window.innerWidth : window.innerHeight;
    this.dpr=Math.min(window.devicePixelRatio||1,2);
    this.cv.width=Math.floor(w*this.dpr); this.cv.height=Math.floor(h*this.dpr);
    this.cv.style.width=w+'px'; this.cv.style.height=h+'px';
    this.viewW=w; this.viewH=h;
    this.TS=Math.max(34, Math.round(Math.min(w/14, h/8)));   // 화면에 ~14x8 타일
  },

  // ----- 입력: 키보드 -----
  keys:{},
  onKey(e){ if(this.overlayOpen()) return; const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'}; if(m[e.key]){this.keys[m[e.key]]=1;e.preventDefault();} if(e.key===' '||e.key==='Enter'){this.interact();e.preventDefault();} },
  onKeyUp(e){ const m={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r',w:'u',s:'d',a:'l',d:'r'}; if(m[e.key])this.keys[m[e.key]]=0; },

  // ----- 입력: 조이스틱 -----
  bindStick(){
    const zone=document.getElementById('stick-zone');
    const base=document.getElementById('stick-base'), knob=document.getElementById('stick-knob');
    const R=52;
    // 중앙 보정 31px(=(베이스118-노브56)/2). 떼면 정확히 중앙으로 복귀
    const setKnob=(dx,dy)=>{ knob.style.transform=`translate(${31+dx}px, ${-31+dy}px)`; };
    const reset=()=>{ this.stick.active=false; this.stick.dx=0; this.stick.dy=0; setKnob(0,0); };
    zone.addEventListener('pointerdown', e=>{ e.preventDefault();
      const b=base.getBoundingClientRect(); this.stick.active=true; this.stick.id=e.pointerId;
      this.stick.cx=b.left+b.width/2; this.stick.cy=b.top+b.height/2; move(e); zone.setPointerCapture(e.pointerId); });
    zone.addEventListener('pointermove', e=>{ if(this.stick.active&&e.pointerId===this.stick.id) move(e); });
    zone.addEventListener('pointerup',   e=>{ if(e.pointerId===this.stick.id) reset(); });
    zone.addEventListener('pointercancel', reset);
    const self=this;
    function move(e){ let dx=e.clientX-self.stick.cx, dy=e.clientY-self.stick.cy;
      // 콘텐츠가 90° 회전된 상태면 화면 델타를 게임 좌표로 역회전(화면→로컬)
      if(document.body.classList.contains('rot')){ const t=dx; dx=dy; dy=-t; }
      const d=Math.hypot(dx,dy)||1; if(d>R){ dx=dx/d*R; dy=dy/d*R; }
      self.stick.dx=dx/R; self.stick.dy=dy/R; setKnob(dx,dy); }
    reset();
  },

  interact(e){ if(e&&e.preventDefault)e.preventDefault(); if(window.Battle&&Battle.active) return;
    const ptx=Math.round(this.px), pty=Math.round(this.py);
    // 1) 퀘스트 NPC 우선  (Quest/DarkDuel은 최상위 const라 window에 안 붙음 → bare 참조로 호출)
    const npc=(this.npcs||[]).find(n=>Math.abs(n.x-ptx)+Math.abs(n.y-pty)<=1);
    if(npc){ if(typeof Quest!=='undefined') Quest.talk(npc.id); return; }
    // 2) 숨겨진 어둠의 상인
    if(this.secret && (Explore.state.events||{}).darkMerchant!=='gone' && Math.abs(this.secret.x-ptx)+Math.abs(this.secret.y-pty)<=1){
      if(typeof DarkDuel!=='undefined') DarkDuel.meet(); return; }
    // 2.1) 달의 뒷면 — 루나의 어둠(대화 → 짧은 이야기 → 전투)
    if(this.arenaBoss && Math.abs(this.arenaBoss.x-ptx)+Math.abs(this.arenaBoss.y-pty)<=1){
      if(typeof LunaShadow!=='undefined') LunaShadow.meet(); return; }
    // 2.5) 대장간(장비 제작소) — 건물에 와야만 제작 가능
    if(this.forge && Math.abs(this.forge.x-ptx)+Math.abs(this.forge.y-pty)<=1){ this.openForge(); return; }
    // 2.6) 경로 이벤트(보물/선택/시련/흥정)
    { const ev=(this.events||[]).find(e=>Math.abs(e.x-ptx)+Math.abs(e.y-pty)<=1);
      if(ev){ if(typeof GameEvent!=='undefined') GameEvent.open(ev.def); return; } }
    // 3) 채집
    let best=null,bd=99;
    for(const n of this.nodes){ if(n.taken)continue; const d=Math.abs(n.x-ptx)+Math.abs(n.y-pty);
      if(d<=1 && d<bd){bd=d;best=n;} }
    if(best) this.collect(best); else this.toast(`주변에 채집할 재료가 없어요 ${UI_ICON.leaf}`);
  },

  collect(n){
    const mat=MATERIALS[n.mat];
    Explore.state.materials[n.mat]=(Explore.state.materials[n.mat]||0)+1;
    n.taken=true; n.reSteps=(Explore.state.steps||0)+40;
    Sfx.play('gather'); exHaptic('light');
    Explore.refreshHUD(); Explore.persist(); this.updateActionBtn();
    const w=this.pickWord();
    this.toast(`<img class="mi" src="${mat.img}" alt=""> <b>${mat.name}</b> +1<br><span class="en">${w.w}</span> · <span class="ko">${w.m}</span>`+compSay('gather',0.4));
  },
  pickWord(){
    const due=(Explore.cafe.myWords||[]).filter(v=>(v.due||0)<=(Explore.cafe.turnCount||0));
    if(due.length) return due[Math.floor(this.rnd()*due.length)]; // 매번 첫 단어만 나오던 문제 수정
    const pool=window.wordData?[].concat(wordData.easy,wordData.normal,wordData.hard):[];
    return pool.length?pool[Math.floor(this.rnd()*pool.length)]:{w:'coffee',m:'커피'};
  },
  toast(html, ms){ const el=document.getElementById('toast'); el.innerHTML=html; el.classList.add('show');
    clearTimeout(this._tt); this._tt=setTimeout(()=>el.classList.remove('show'), ms||1600); },
  // [HUD 설명] 울림/크리/방어/가속 — 모바일은 title 툴팁이 안 보이므로 탭하면 풀이를 띄운다(자세한 4축 설명)
  explainVocabPower(){
    const vp=(typeof Explore!=='undefined' && Explore.vocabPower) ? Explore.vocabPower() : null;
    const cur = vp ? `<br><br><b>지금 내 수치</b><br>`
      + `공격 +${Math.round(vp.atkPct*100)}% · 크리 +${Math.round(vp.critBonus*100)}%p · `
      + `방어 +${Math.round(vp.defPct*100)}% · 가속 +${Math.round(vp.gaugePct*100)}%` : '';
    this.toast(
      `<b>울림 지수란?</b><br><span class="ko">카페에서 옛말(영단어)을 공부한 만큼, 탐험 전투력이 자동으로 올라가는 시스템이에요.</span><br><br>`
      + `<div class="toast-li"><b>${UI_ICON.atk} 공격</b> — 마스터한(완전히 외운) 단어 수가 많을수록 상승 (최대 +30%)</div>`
      + `<div class="toast-li"><b>✦ 크리</b> — 카페 최근 40문제 정답률이 50%를 넘으면 그만큼 상승 (최대 +15%p, 50% 이하는 페널티 없이 0)</div>`
      + `<div class="toast-li"><b>${UI_ICON.def} 방어</b> — 오답노트 단어를 완전히 정복(SRS 졸업)한 개수만큼 상승 (최대 +25%)</div>`
      + `<div class="toast-li"><b>⚡ 가속</b> — 카페 VIP 손님 스펠링을 직접 입력해서 맞힌 누적 횟수만큼, 탐험 스킬 게이지 차는 속도 상승 (최대 +40%)</div>`
      + `<div class="toast-sub ko">→ 게이지가 빨리 찰수록 캐릭터 고유 스킬을 더 자주 쓸 수 있어요. 스킬은 기본 공격보다 훨씬 세서, 특히 오래 끄는 보스전에서 체감 화력 차이가 커요.</div>`
      + cur,
      6500
    );
  },

  // ----- 이동/업데이트 -----
  // 오버레이(스탯/조합/스펠/동행/전투)가 떠 있으면 이동·인카운터 정지
  overlayOpen(){ return !!(document.querySelector('.ex-overlay.show') || (window.Battle&&Battle.active)); },
  update(f){
    f = f || 1;   // 프레임 배율(delta-time). 미지정 시 60fps 가정
    if(this.overlayOpen()){ this.moving=false; return; }
    let vx=this.stick.dx, vy=this.stick.dy;
    if(this.keys.l)vx-=1; if(this.keys.r)vx+=1; if(this.keys.u)vy-=1; if(this.keys.d)vy+=1;
    const mag=Math.hypot(vx,vy);
    this.moving = mag>0.18;   // 데드존 ↑(살짝 기울임은 무시)
    if(this.moving){
      this.walkT=(this.walkT||0)+0.28*f;   // 보행 위상(팔다리 스윙)
      vx/=Math.max(1,mag); vy/=Math.max(1,mag);
      if(Math.abs(vx)>0.2) this.facing=vx<0?-1:1;
      const SPD=0.058*f;   // 이동 속도(delta-time 반영 — fps 무관 일정)
      const nx=this.px+vx*SPD, ny=this.py+vy*SPD;
      // 충돌: 발 위치 타일 검사
      if(!this.isBarrier(Math.round(nx), Math.round(this.py))) this.px=nx;
      if(!this.isBarrier(Math.round(this.px), Math.round(ny))) this.py=ny;
      this.onMove();
      // 하단 게이트 — 비밀 공간(gateBack)은 원래 존으로, 이전 지역(prev)이 있으면 그 지역으로, 없으면 마을(카페)로.
      //   prev 이동은 포털처럼 재진입 스팸 방지 가드(_gateArmed)가 필요 — leaveToVillage는 _leaving 자체가 가드 역할.
      if(this.gate && Math.round(this.py)>=this.gate.y && Math.abs(Math.round(this.px)-this.gate.x)<=2){
        if(this.gateBack){ const back=this.gateBack; this.gateBack=null; this.travelZone(back); }
        else{
          const prevZone=(ZONES[Explore.state.map.zone]||{}).prev;
          if(prevZone){ if(this._gateArmed!==false){ this._gateArmed=false; this.travelZone(prevZone); } }
          else this.leaveToVillage();
        }
      } else if(this.gate && Math.round(this.py) < this.gate.y-2){ this._gateArmed=true; }
      // [숨은 틈] 달 오른쪽 복도 끝 — 맵 바깥(달의 뒷면)으로 넘어간다. 포털과 같은 재진입 가드 사용.
      if(this.rift){
        const onRift = Math.round(this.py)<=this.rift.y && Math.abs(Math.round(this.px)-this.rift.x)<=1;
        if(onRift){ if(this._riftArmed!==false){ this._riftArmed=false; this.tryRift(); } }
        else if(Math.round(this.py) > this.rift.y+2) this._riftArmed=true;
      }
      // 상단 포털(들) — 재진입 스팸 방지를 위해 포털을 벗어났다 들어올 때만 발동
      if(this.portals && this.portals.length){
        let onAny=false;
        for(const pt of this.portals){
          if(Math.round(this.py)<=pt.y && Math.abs(Math.round(this.px)-pt.x)<=2){
            onAny=true;
            if(this._portalArmed!==false){ this._portalArmed=false; this.tryZonePortal(pt.target); }
            break;
          }
        }
        if(!onAny && Math.round(this.py) > 3) this._portalArmed=true;
      }
    }
  },
  // 마을(카페)로 복귀 — 다음 입장 때는 팻말 위쪽(start)에서 시작해야 한다.
  // 게이트를 밟은 자리 그대로 복원되면, 조금만 움직여도 다시 게이트에 닿아 마을로 튕긴다.
  leaveToVillage(){ if(this._leaving)return; this._leaving=true; this.moving=false;
    this.toast(`${UI_ICON.village} 마을로 돌아갑니다…`);
    // 게이트 좌표가 아니라 '팻말 위쪽 시작점'을 저장. (_leaving 동안 pagehide가 덮어쓰지 못하게 막아둠)
    Explore.state.pos = this.start ? { x:this.start.x, y:this.start.y } : null;
    try{ Explore.persist(); }catch(e){}
    setTimeout(()=>{ try{ Explore.exitToCafe(); }catch(e){ location.href='index.html'; } }, 450); },
  // 상단 포털: 이웃 존으로 이동(앞으로 갈 땐 레벨 잠금, 되돌아가는 건 자유)
  tryZonePortal(targetId){
    const cur=ZONES[Explore.state.map.zone]||ZONES.forest;
    const target=ZONES[targetId];
    if(!target) return;
    const bounce=()=>{ this.py=Math.min(this.HT-2, this.py+1.5); };   // 살짝 되튕김
    if(cur.next===targetId && (Explore.state.level||1) < target.minLv){
      this.toast(`${UI_ICON.lock} ${target.name} — Lv ${target.minLv} 이상부터 입장`);
      bounce(); return;
    }
    // [스토리 게이트] 봉인고는 카페에서 드미타스를 꺾은 뒤에만 열린다(스포일러 방지 + 서사 순서 보장)
    if(cur.next===targetId && target.reqDemitas && this.demitasStage() < target.reqDemitas){
      this.toast(`${UI_ICON.lock} ${target.name} — 굳게 잠겨 있다.<br><span class="ko">카페에서 그와의 이야기가 끝나야 열릴 것 같다.</span>`);
      bounce(); return;
    }
    // [지도 게이트] 달은 앞선 모든 지역의 지도를 완성하고(포스트게임=탐험 완주 보상),
    //   카페에서 루나가 지도의 마지막 빈 칸을 '달'이라고 읽어줘야 길이 열린다(vb_moon_open).
    if(cur.next===targetId && target.reqMaps){
      const m=this.mapsProgress(target.reqMaps);
      if(m.have < m.need){
        this.toast(`${UI_ICON.lock} ${target.name} — 아직 길이 보이지 않는다.<br><span class="ko">지도 조각 ${m.have} / ${m.need} · 모든 지역의 지도를 완성해야 한다</span>`);
        bounce(); return;
      }
      if(!this.moonOpened()){
        this.toast(`${UI_ICON.lock} ${target.name} — 지도는 다 채웠는데 길이 안 보인다.<br><span class="ko">카페에서 루나에게 지도를 보여주자</span>`);
        bounce(); return;
      }
    }
    // [보스 관문] 다음 지역으로 넘어가려면 현재 지역의 보스를 먼저 꺾어야 한다 — 랜덤 필드 조우 대신
    //   '길을 막아서는' 확정 조우로 전환. 한 번 꺾으면(zoneBoss[zid]) 그 지역은 자유통행.
    if(cur.next===targetId && cur.boss && !this.bossCleared(Explore.state.map.zone)){
      bounce();
      Battle.start({ boss:true, gateTo:targetId });
      return;
    }
    this.travelZone(targetId);
  },
  bossCleared(zoneId){ return !!(Explore.state.zoneBoss||{})[zoneId]; },
  markBossCleared(zoneId){ if(!Explore.state.zoneBoss) Explore.state.zoneBoss={}; Explore.state.zoneBoss[zoneId]=true; },
  // [숨은 틈] 달 가장자리 복도 끝 → 달의 뒷면. '가장 오래된 말'을 꺾기 전엔 열리지 않는다(탐색 보상의 순서 보존).
  tryRift(){
    const bounce=()=>{ this.py=Math.min(this.HT-2, this.py+2); };
    if(!this.bossCleared('moon')){
      this.toast(`벽 너머에서 희미한 바람이 분다…<br><span class="ko">아직은 지나갈 수 없다. 이 땅에 더 오래된 것이 먼저 있다.</span>`);
      bounce(); return;
    }
    this.toast(`${UI_ICON.spark} 가장자리인 줄 알았던 곳에, 길이 있었다.`);
    this.travelZone('moonback');
  },

  _accum:0, _saveT:0,

  // ----- 렌더 -----
  loop(ts){ this.raf=requestAnimationFrame(t=>this.loop(t));

  // ===== 미니맵(안개 걷힘) + 지도 완성 =====
  initMinimap(){ const cv=document.getElementById('minimap'); if(!cv)return; cv.width=this.WT; cv.height=this.HT; this._mmctx=cv.getContext('2d'); this._miniDirty=true; },
  buildExplored(){ const zone=Explore.state.map.zone; const saved=(Explore.state.explored||{})[zone];
    this.explored=[]; this.exploredCount=0;

  reveal(){ if(!this.explored)return; const px=Math.round(this.px), py=Math.round(this.py); const R=3.4, R2=R*R; let added=0;

    if(added){ this._miniDirty=true; this.checkMapComplete(); } },
  checkMapComplete(){ const zone=Explore.state.map.zone; if((ZONES[zone]||{}).arena) return;   // 비밀 공간은 지도 대상 아님

  // 미니맵 색도 존 테마를 따라간다(달인데 초록 미니맵이던 문제)

  _mmColor(x,y){ const c=this._MM_COL[zoneTheme().ground]||this._MM_COL.grass;

  drawMinimap(){ const ctx=this._mmctx; if(!ctx||!this.explored)return; const WT=this.WT,HT=this.HT;

    const dot=(x,y,c)=>{ if(x<0||y<0||x>=WT||y>=HT||!this.explored[y][x])return; ctx.fillStyle=c; ctx.fillRect(x,y,1,1); };
    const seen=(x,y)=>x>=0&&y>=0&&x<WT&&y<HT&&this.explored[y][x];
    // 마커 블록 — check=true면 미탐험 타일엔 안 그린다(안개 규칙 유지)
